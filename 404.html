<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません｜図美楽（zumiraku）</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .code { color: var(--accent); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 64px; line-height: 1; letter-spacing: .06em; }
  .msg { margin: 20px 0 0; color: var(--dim); font-size: 14px; }
  .back { display: inline-block; margin-top: 28px; padding: 13px 28px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: inherit; font-size: 14px; text-decoration: none; transition: border-color .2s ease-out; }
  .back:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main class="card">
  <p class="code">404</p>
  <p class="msg">そのページはありません。</p>
  <a class="back" href="/">トップへ戻る</a>
</main>
</body>
</html>
