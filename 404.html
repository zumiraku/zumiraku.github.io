<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません｜図美楽（zumiraku）</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .nf { display: grid; place-items: center; min-height: 100svh; text-align: center; }
  .nf__code { color: var(--accent); font-family: var(--mono); font-size: clamp(56px, 16vw, 128px); line-height: 1; letter-spacing: .04em; }
  .nf__txt { margin-top: 20px; color: var(--txt-dim); }
  .nf .btn { margin-top: 32px; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><span class="bg__grid"></span><span class="bg__glow bg__glow--a"></span></div>
<main class="nf">
  <div class="wrap">
    <p class="nf__code">404</p>
    <h1 class="sec__ttl">そのページはありません。</h1>
    <p class="nf__txt">URLが変わったか、もともと無かったかのどちらかです。</p>
    <a class="btn btn--main" href="/">トップへ戻る</a>
  </div>
</main>
<script>
  (function () {
    var r = document.documentElement, s = null;
    try { s = localStorage.getItem('theme'); } catch (e) {}
    r.dataset.theme = s || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  })();
</script>
</body>
</html>
